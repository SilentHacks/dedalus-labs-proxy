services:
  dedalus-proxy:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DEDALUS_API_KEY=${DEDALUS_API_KEY:?DEDALUS_API_KEY is required}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
