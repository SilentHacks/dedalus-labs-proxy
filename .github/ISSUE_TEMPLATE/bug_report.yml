name: Bug report
description: Report a problem with the proxy
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include API keys or other secrets.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands, request payloads, or config that trigger the issue.
      placeholder: |
        1. Start proxy with ...
        2. Send request to /v1/chat/completions ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Proxy version or commit
      placeholder: e.g. 0.1.0 or git SHA
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: e.g. Python 3.12, Docker, OpenCode 1.x
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets before pasting.
      render: shell
